{% if page.meta.comments != false %}
<h2 id="__comments">{{ lang.t("meta.comments") }}</h2>
<div id="__comments-container"></div>

<script>
  /* navigation.instant swaps page content without a full reload, so a
     plain <script src="giscus..."> only ever ran once and comments
     silently disappeared on every post reached via in-site navigation.
     document$ is Material's observable that fires on every instant
     page change - fully clear and re-create the giscus script each
     time so it re-initializes for whichever post is now showing.

     Two things the first attempt at this fix got wrong, corrected here:
     - the script must live in its own container, never nested inside
       the <h2> itself (a script appended as a child of the heading is
       still valid HTML, but giscus's own iframe then also lands nested
       inside the heading, which is not what you want structurally)
     - removing only the OLD <script src="giscus..."> tag leaves its
       already-inserted <iframe class="giscus-frame"> behind untouched,
       so the previous page's stale iframe just sits there instead of
       being replaced - container.innerHTML = "" clears both.

     Third bug, found by testing a direct/hard page load in real
     Chromium (not just a click-through from the homepage): this script
     runs immediately, synchronously, at its position in the HTML - but
     document$ is defined by Material's own JS bundle, which may not
     have finished loading yet on a fresh page load (it's deferred/
     module-loaded, so timing vs this inline script is a race, not
     guaranteed). Losing that race throws "document$ is not defined"
     and this whole script dies silently - giscus never gets appended
     at all. This is NOT a rare edge case: a hard page load is exactly
     what happens on giscus's own OAuth callback redirect
     (?giscus=<token>), which is why signing in could make comments
     "disappear" - the very moment giscus needs its container to still
     be there, this script had a decent chance of never having run.
     Fix: don't assume document$ exists - poll for it. */
  (function initComments() {
    if (typeof document$ === "undefined") {
      setTimeout(initComments, 50)
      return
    }

    document$.subscribe(function() {
      var container = document.getElementById("__comments-container")
      if (!container) {
        return
      }

      container.innerHTML = ""

      var script = document.createElement("script")
      script.src = "https://giscus.app/client.js"
      script.setAttribute("data-repo", "shubhamwagh/blog")
      script.setAttribute("data-repo-id", "R_kgDOSh2Phw")
      script.setAttribute("data-category", "Announcements")
      script.setAttribute("data-category-id", "DIC_kwDOSh2Ph84C9Ygj")
      script.setAttribute("data-mapping", "pathname")
      script.setAttribute("data-strict", "0")
      script.setAttribute("data-reactions-enabled", "1")
      script.setAttribute("data-emit-metadata", "0")
      script.setAttribute("data-input-position", "bottom")
      script.setAttribute("data-theme", "preferred_color_scheme")
      script.setAttribute("data-lang", "en")
      script.setAttribute("crossorigin", "anonymous")
      script.async = true
      container.appendChild(script)
    })
  })()
</script>
{% endif %}
