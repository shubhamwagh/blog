site_name: Shubham's Notes
site_url: https://blog.shublab.com
site_description: Building things, breaking things, writing it down.
site_author: Shubham

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - rss:
      match_path: posts/.*
      date_from_meta:
        as_creation: date
      image: https://blog.shublab.com/assets/favicon.svg
  - blog:
      blog_dir: .
      post_date_format: medium
      post_url_format: "{slug}"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - footnotes
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shubhamwagh
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/shubhamwagh/
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.co.uk/citations?user=VDFIu0sAAAAJ
