server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Self-hosted Umami, reverse-proxied here instead of exposed on its own
    # domain. umami.shublab.com is private LAN/Tailscale-only, unroutable
    # for real public visitors; a Traefik-level IngressRoute proxy was
    # tried first but is bypassed entirely here - Cloudflare Tunnel routes
    # this hostname directly to this pod, never through Traefik at all
    # (confirmed: requests that should have hit the Traefik route were
    # actually answered by THIS nginx's own 404 page). Proxying from
    # inside this container works regardless of what Cloudflare Tunnel's
    # configured target is, since this pod is what's actually receiving
    # the traffic.
    location /stats/ {
        proxy_pass http://umami.umami.svc.cluster.local:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
